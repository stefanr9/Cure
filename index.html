<!doctype html>
<html lang="sr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Ћуретов сокак — сајт је у изради</title>
        <meta name="robots" content="noindex, nofollow">
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" href="Fotografije/favicon.png" type="image/png" />
        <style>
            .wip {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 2rem;
                gap: 1.5rem;
            }
            .wip .logo-wip { width: 240px; max-width: 62%; height: auto; }
            .wip h1 {
                font-family: "CustomFont", serif;
                color: #6e4446;
                font-size: 4rem;
                line-height: 1.05;
                margin: 0;
            }
            .wip p { font-size: 1.5rem; color: #333; margin: 0; max-width: 40ch; }
            @media (max-width: 600px) {
                .wip h1 { font-size: 3rem; }
                .wip p { font-size: 1.25rem; }
            }
        </style>
    </head>
    <body>
        <main class="wip">
            <img class="logo-wip" src="logo.png" alt="Ћуретов сокак" />
            <h1>Сајт је у изради</h1>
            <p>Ускоро смо online. Хвала на стрпљењу.</p>
        </main>
    </body>
</html>
